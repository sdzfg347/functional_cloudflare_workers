name: Deploy Worker
run-name: Deploy ${{ inputs.worker }}/${{ inputs.environment }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker project
        type: choice
        required: true
        default: clock-api
        options:
          - clock-api
          - health-api
      environment:
        description: Target environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: worker-deploy-${{ inputs.worker }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.worker }}/${{ inputs.environment }}
    if: >-
      (inputs.environment == 'dev' || inputs.environment == 'prod') &&
      (github.actor == 'sdzfg347' || github.actor == 'theideasaler') &&
      (inputs.environment == 'dev' || github.ref == 'refs/heads/main') &&
      (github.actor == 'sdzfg347' || inputs.environment == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      worker: ${{ steps.validate-worker.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate Worker folder
        id: validate-worker
        env:
          WORKER: ${{ inputs.worker }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$WORKER" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "Worker must be a lowercase folder name using letters, numbers and hyphens: $WORKER"
            exit 1
          fi
          test -d "workers/$WORKER"
          test -f "workers/$WORKER/package.json"
          test -f "workers/$WORKER/wrangler.jsonc"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: validate
    if: inputs.environment == 'dev' && needs.validate.result == 'success'
    name: Deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Deploy dev Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.DEV_WORKERS_DEPLOYMENT_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/${{ needs.validate.outputs.worker }}
          command: deploy --env dev --var GIT_SHA:${{ github.sha }} --message "Deployed by ${{ github.actor }} via GitHub Actions run ${{ github.run_number }}"

  deploy-prod:
    needs: validate
    if: inputs.environment == 'prod' && needs.validate.result == 'success'
    name: Deploy prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Deploy prod Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.PROD_WORKERS_DEPLOYMENT_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/${{ needs.validate.outputs.worker }}
          command: deploy --env prod --var GIT_SHA:${{ github.sha }} --message "Deployed by ${{ github.actor }} via GitHub Actions run ${{ github.run_number }}"
